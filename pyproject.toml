[project]
name = "diffwise"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle: basic style errors
    "F",   # pyflakes: real bugs (unused imports, undefined names)
    "I",   # isort: imports sorted consistently
    "B",   # bugbear: common bug patterns
    "UP",  # pyupgrade: use modern Python syntax
    "S",   # bandit: security issues (hard-coded passwords, unsafe calls)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # `assert` is how pytest tests work, so allow it in tests
