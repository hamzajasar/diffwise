# Checks that run automatically on every `git commit`.
# Run on all files manually: uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key       # block commits containing private keys
      - id: check-added-large-files  # block accidentally committing huge files
      - id: check-toml
      - id: check-yaml
      # Fixtures are exact copies of real data (diffs, payloads): never rewrite them.
      - id: end-of-file-fixer
        exclude: ^backend/tests/fixtures/
      - id: trailing-whitespace
        exclude: ^backend/tests/fixtures/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check   # linter: finds bugs, style and security issues
        args: [--fix]
      - id: ruff-format  # formatter: makes code style consistent
